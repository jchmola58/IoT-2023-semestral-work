[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "iot-detector"
version = "0.1.0"
description = "Detect BENIGN vs MALICIOUS IoT traffic records (CICIoT2023) with a reproducible, tested pipeline."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Jozef Chmola"}]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scikit-learn>=1.2",
    "joblib>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
data = ["pyarrow>=10"]

[project.scripts]
iot-detector = "iot_detector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
